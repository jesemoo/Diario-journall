<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuaderno de aprendizaje</title>

  <!-- Tipografías: DM Sans (interfaz) y Caveat (escritura a mano en las notas). Hay fuentes de respaldo en el CSS. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ SPRITE DE ÍCONOS SVG (se reutilizan con <use href="#id">) ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="11" r="1.6" fill="currentColor"/><path d="M9 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-l" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron-r" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.2-4-7.8-9-7.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <!-- ============ ENCABEZADO ============ -->
  <header class="app-header">

    <!-- Logo y título -->
    <a class="brand" href="#" aria-label="Cuaderno de aprendizaje">
      <svg class="icon icon-lg"><use href="#i-logo"/></svg>
      <span class="brand-name">Cuaderno</span>
    </a>

    <!-- Contenedor del temporizador Pomodoro (la lógica llegará en otro módulo) -->
    <section class="pomodoro" aria-label="Temporizador Pomodoro">
      <span class="pomodoro-mode" id="pomodoro-mode">Enfoque</span>
      <output class="pomodoro-time" id="pomodoro-time">25:00</output>
      <button class="btn-icon" id="pomodoro-toggle" type="button" aria-label="Iniciar temporizador">
        <svg class="icon"><use href="#i-play"/></svg>
      </button>
      <button class="btn-icon" id="pomodoro-reset" type="button" aria-label="Reiniciar temporizador">
        <svg class="icon"><use href="#i-reset"/></svg>
      </button>
    </section>

    <!-- Selector de paleta: cada clic pasa a la siguiente -->
    <button class="btn-theme" id="theme-toggle" type="button" aria-label="Cambiar paleta de colores">
      <svg class="icon"><use href="#i-palette"/></svg>
      <span id="theme-name">Claro cálido</span>
    </button>
  </header>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main class="layout">

    <!-- Panel lateral izquierdo -->
    <aside class="sidebar">

      <!-- Notas rápidas: hoja con fondo punteado, como un bullet journal -->
      <section class="panel" aria-labelledby="notes-title">
        <h2 id="notes-title">Notas rápidas</h2>
        <textarea id="scratchpad" class="scratchpad" placeholder="Escribe una idea, una duda o algo que quieras recordar…" spellcheck="true"></textarea>
      </section>

      <!-- Lista de hábitos y recomendaciones -->
      <section class="panel" aria-labelledby="habits-title">
        <h2 id="habits-title">Hábitos de hoy</h2>
        <!-- Los hábitos se dibujan desde script.js -->
        <ul class="habits" id="habits-list"></ul>
        <form class="habit-add" id="habit-form">
          <input id="habit-input" type="text" placeholder="Nuevo hábito…" maxlength="60" autocomplete="off" aria-label="Nuevo hábito">
          <button class="btn-icon" type="submit" aria-label="Agregar hábito"><svg class="icon"><use href="#i-plus"/></svg></button>
        </form>
      </section>
    </aside>

    <!-- Calendario del mes -->
    <section class="calendar" aria-labelledby="calendar-title">
      <div class="calendar-head">
        <h1 id="calendar-title">Mes</h1>
        <div class="calendar-nav">
          <button class="btn-icon" id="prev-month" type="button" aria-label="Mes anterior"><svg class="icon"><use href="#i-chevron-l"/></svg></button>
          <button class="btn-text" id="today-btn" type="button">Hoy</button>
          <button class="btn-icon" id="next-month" type="button" aria-label="Mes siguiente"><svg class="icon"><use href="#i-chevron-r"/></svg></button>
        </div>
      </div>

      <!-- Días de la semana (la semana empieza en lunes) -->
      <div class="weekdays" aria-hidden="true">
        <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
      </div>

      <!-- Cuadrícula de días: la genera script.js -->
      <div class="days-grid" id="calendar-grid"></div>
    </section>
  </main>

  <!-- ============ VISTA DIARIA (MODAL) ============
       Usa el elemento nativo <dialog>: cierra con Esc y mantiene el foco dentro. -->
  <dialog class="day-modal" id="day-modal" aria-labelledby="day-modal-title">

    <!-- Fecha seleccionada + botón de cerrar -->
    <header class="modal-head">
      <h2 id="day-modal-title">Fecha</h2>
      <div class="modal-actions">
        <button class="btn-text" id="clear-day" type="button">Limpiar día</button>
        <button class="btn-icon" id="modal-close" type="button" aria-label="Cerrar y volver al calendario">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>

    <!-- Confirmación breve antes de vaciar el día -->
    <div class="confirm-bar" id="confirm-bar" hidden>
      <span>¿Vaciar todas las notas de este día?</span>
      <button class="btn-text" id="confirm-yes" type="button">Sí, vaciar</button>
      <button class="btn-text" id="confirm-no" type="button">Cancelar</button>
    </div>

    <!-- Etiqueta de color: aparece como barrita en la casilla del calendario -->
    <div class="label-row" id="label-row" role="group" aria-label="Etiqueta del día">
      <span>Etiqueta</span>
      <button type="button" class="lb lb-green" data-label="green" aria-pressed="false" aria-label="Verde"></button>
      <button type="button" class="lb lb-blue" data-label="blue" aria-pressed="false" aria-label="Azul"></button>
      <button type="button" class="lb lb-yellow" data-label="yellow" aria-pressed="false" aria-label="Amarillo"></button>
      <button type="button" class="lb lb-pink" data-label="pink" aria-pressed="false" aria-label="Rosa"></button>
      <button type="button" class="lb lb-purple" data-label="purple" aria-pressed="false" aria-label="Morado"></button>
      <button type="button" class="btn-text" data-label="">Quitar etiqueta</button>
    </div>

    <!-- Barra de pestañas + botón [+] para agregar otra -->
    <div class="tabs-bar">
      <div class="tabs" id="tab-list" role="tablist" aria-label="Páginas del día">
        <button class="tab" id="tab-log" type="button" role="tab" aria-selected="true" aria-controls="panel-log">Bitácora del día</button>
        <button class="tab" id="tab-draft" type="button" role="tab" aria-selected="false" aria-controls="panel-draft" tabindex="-1">Borrador libre</button>
      </div>
      <button class="btn-icon" id="tab-add" type="button" aria-label="Agregar pestaña">
        <svg class="icon"><use href="#i-plus"/></svg>
      </button>
    </div>

    <!-- Barra de formato: actúa sobre el texto seleccionado en el editor activo -->
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formato de texto">
      <button type="button" data-cmd="bold" aria-label="Negrita"><b>B</b></button>
      <button type="button" data-cmd="italic" aria-label="Cursiva"><i>I</i></button>
      <button type="button" data-cmd="underline" aria-label="Subrayado"><u>S</u></button>
      <span class="tb-sep"></span>
      <button type="button" class="swatch sw-1" data-hl aria-label="Resaltar en amarillo"></button>
      <button type="button" class="swatch sw-2" data-hl aria-label="Resaltar en rosa"></button>
      <button type="button" class="swatch sw-3" data-hl aria-label="Resaltar en verde"></button>
      <span class="tb-sep"></span>
      <button type="button" data-cmd="clear" aria-label="Quitar formato del texto seleccionado">Quitar formato</button>
    </div>

    <!-- Contenido de cada pestaña. Cada .editor tiene un data-field que se guarda por fecha -->
    <div class="tab-panels" id="tab-panels">

      <!-- Pestaña 1: bitácora en tarjetas suaves -->
      <section class="tab-panel" id="panel-log" role="tabpanel" aria-labelledby="tab-log">
        <p class="log-intro">¿Qué te llevas de hoy? Escribe lo que quieras; no hace falta llenarlo todo.</p>
        <article class="note-card tint-1"><h3>Lo que aprendí hoy</h3>
          <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Lo que aprendí hoy" data-field="learned" data-placeholder="Lo que descubriste, entendiste o practicaste…"></div></article>
        <article class="note-card tint-2"><h3>Dudas</h3>
          <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Dudas" data-field="doubts" data-placeholder="Lo que quedó en el aire y quieres resolver…"></div></article>
        <article class="note-card tint-3"><h3>Notas</h3>
          <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Notas" data-field="notes" data-placeholder="Enlaces, ideas sueltas, recordatorios…"></div></article>
      </section>

      <!-- Pestaña 2: hoja libre punteada -->
      <section class="tab-panel" id="panel-draft" role="tabpanel" aria-labelledby="tab-draft" hidden>
        <div class="editor paper" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Borrador libre" data-field="draft" data-placeholder="Espacio libre: esquemas, listas, garabatos…"></div>
      </section>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
